<title>F²Z – Quest-System & Spielerübersicht</title>
<style>
:root{
  --bg:#15171a; --bg2:#1b1e21; --panel:#20242699; --panel-solid:#20242e;
  --line:#33383b; --line-soft:#2a2e31;
  --ink:#dfe3e2; --ink-dim:#98a19c; --ink-faint:#6b7570;
  --olive:#6b7048; --olive-light:#8a9163;
  --rust:#a8542f; --rust-light:#c76b40;
  --red:#8c3b32;
  --gold:#c9a24b; --gold-light:#e0bd6e;
  --green:#5c7a52;
  --radius:3px;
  --mono:'Consolas','Courier New',monospace;
  --sans:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0;min-height:100vh;
  background-image:
    linear-gradient(rgba(20,22,20,0.9),rgba(20,22,20,0.96)),
    repeating-linear-gradient(45deg,#1c1e1c 0,#1c1e1c 2px,#191b19 2px,#191b19 4px);
}
a{color:var(--gold-light);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-track{background:var(--bg2)}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sidebar{background:var(--bg2);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 16px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:10px}
.brand .f2{font-family:var(--mono);color:var(--rust-light);font-size:11px;letter-spacing:2px;text-transform:uppercase}
.brand h1{font-size:17px;margin:4px 0 2px;color:var(--ink);letter-spacing:.5px}
.brand .sub{font-size:11px;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
nav.navlist{display:flex;flex-direction:column;padding:6px 8px}
nav.navlist button{
  all:unset;cursor:pointer;padding:9px 12px;margin:1px 0;border-radius:var(--radius);
  color:var(--ink-dim);font-size:13px;display:flex;align-items:center;gap:8px;border-left:2px solid transparent;
}
nav.navlist button:hover{background:#ffffff08;color:var(--ink)}
nav.navlist button.active{background:#ffffff10;color:var(--gold-light);border-left:2px solid var(--rust-light)}
nav.navlist .grp-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-faint);margin:14px 12px 4px}

main{padding:26px 32px 60px;max-width:1300px}
.view{display:none}
.view.active{display:block}
h2.viewtitle{font-size:22px;margin:0 0 4px;color:var(--ink);letter-spacing:.3px}
.viewtitle .f2{color:var(--rust-light);font-family:var(--mono);font-size:12px;display:block;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
p.viewdesc{color:var(--ink-dim);font-size:13px;margin:0 0 20px;max-width:760px;line-height:1.5}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:28px}
.stat{background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--olive)}
.stat.gold::before{background:var(--gold)}
.stat.rust::before{background:var(--rust)}
.stat .num{font-size:24px;font-weight:600;color:var(--ink);font-family:var(--mono)}
.stat .lbl{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center}
input[type=text],select{
  background:var(--bg2);border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:var(--radius);
  font-size:13px;font-family:var(--sans);
}
input[type=text]{min-width:220px}
input[type=text]:focus,select:focus{outline:1px solid var(--gold);border-color:var(--gold)}
.chip-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{
  border:1px solid var(--line);background:var(--bg2);color:var(--ink-dim);font-size:11.5px;padding:5px 10px;
  border-radius:20px;cursor:pointer;letter-spacing:.2px;user-select:none;
}
.chip:hover{border-color:var(--ink-faint);color:var(--ink)}
.chip.on{background:var(--olive);border-color:var(--olive);color:#101210;font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--gold);transform:translateY(-1px)}
.card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.card .qid{font-family:var(--mono);color:var(--rust-light);font-size:11px}
.card h3{font-size:14.5px;margin:2px 0 6px;color:var(--ink);line-height:1.3}
.card .metaline{font-size:11.5px;color:var(--ink-dim);display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px}
.card .metaline b{color:var(--ink)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;border:1px solid var(--line);color:var(--ink-dim);text-transform:uppercase;letter-spacing:.4px}
.badge.final{border-color:var(--green);color:var(--green)}
.badge.aufbau{border-color:var(--rust);color:var(--rust-light)}
.badge.geplant{border-color:var(--ink-faint);color:var(--ink-faint)}
.badge.illegal{border-color:var(--red);color:#d98b7f}
.badge.rep{border-color:var(--gold);color:var(--gold)}
.badge.uebergang{border-color:#7a8fae;color:#9db3d6}
.badge.chapter{border-color:var(--gold);color:var(--gold-light);background:#c9a24b14}

.section-block{background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.section-block h4{margin:0 0 10px;font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--line-soft);padding-bottom:8px}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;font-size:13px}
.kv div.k{color:var(--ink-dim)}
.kv div.v{color:var(--ink)}
.dialog-block{border-left:3px solid var(--olive);padding:10px 14px;margin-bottom:10px;background:#ffffff05;border-radius:0 var(--radius) var(--radius) 0}
.dialog-block .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--olive-light);margin-bottom:6px}
.dialog-block p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink);white-space:pre-line}
.dialog-block.missing{border-left-color:var(--ink-faint)}
.dialog-block.missing p{color:var(--ink-faint);font-style:italic}
.itemlist{list-style:none;margin:0;padding:0;font-size:13px}
.itemlist li{padding:5px 0;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:10px}
.itemlist li:last-child{border-bottom:none}
.itemlist .qty{font-family:var(--mono);color:var(--gold);min-width:46px}
.itemlist .note{color:var(--ink-faint);font-size:11.5px}
.linklist{display:flex;flex-wrap:wrap;gap:6px}
.linkchip{font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:var(--radius);color:var(--gold-light);cursor:pointer}
.linkchip:hover{border-color:var(--gold)}
.backbtn{all:unset;cursor:pointer;color:var(--ink-dim);font-size:12.5px;margin-bottom:14px;display:inline-block}
.backbtn:hover{color:var(--gold)}
.npc-card{background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer}
.npc-card:hover{border-color:var(--gold)}
.npc-card h3{margin:2px 0 4px;font-size:15.5px}
.npc-card .role{color:var(--ink-dim);font-size:12px;margin-bottom:8px}
.rep-block{margin-bottom:22px}
.rep-block h3{font-size:15px;color:var(--ink);margin:0 0 4px}
.rep-total{font-family:var(--mono);color:var(--gold);font-size:12px;margin-bottom:10px}
.rep-tier{display:flex;gap:14px;padding:8px 0;border-bottom:1px dashed var(--line-soft);align-items:baseline;flex-wrap:wrap}
.rep-tier .thresh{font-family:var(--mono);color:var(--gold-light);min-width:90px;font-size:12.5px}
.rep-tier .quests{display:flex;flex-wrap:wrap;gap:6px}
.tree{font-family:var(--mono);font-size:12.5px;line-height:1.9;white-space:pre;color:var(--ink-dim);overflow-x:auto}
.tree b{color:var(--ink)}
.tree .g{color:var(--olive-light)}
.tree .r{color:var(--rust-light)}
.tree .y{color:var(--gold-light)}
.note-box{border:1px dashed var(--line);border-radius:var(--radius);padding:12px 14px;font-size:12.5px;color:var(--ink-dim);margin-top:10px;background:#ffffff04}
.note-box.warn{border-color:var(--rust);color:#d9b9a3}
.itemdb-entry{margin-bottom:6px}
.itemdb-entry summary{cursor:pointer;padding:10px 14px;background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--radius);font-size:13px;display:flex;justify-content:space-between;list-style:none}
.itemdb-entry summary::-webkit-details-marker{display:none}
.itemdb-entry summary .n{color:var(--ink);font-family:var(--mono)}
.itemdb-entry summary .c{color:var(--ink-faint);font-size:11.5px}
.itemdb-entry .body{padding:10px 16px;border:1px solid var(--line-soft);border-top:none;background:#ffffff03}
.usage-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:var(--ink-dim)}
.usage-row .tag{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid var(--line)}
.usage-row .tag.req{color:var(--rust-light);border-color:var(--rust)}
.usage-row .tag.rew{color:var(--green);border-color:var(--green)}
.empty-msg{color:var(--ink-dim);font-size:13.5px;font-style:italic;padding:20px 0}
table.datacheck{width:100%;border-collapse:collapse;font-size:12.5px}
table.datacheck th{text-align:left;color:var(--gold);border-bottom:1px solid var(--line);padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
table.datacheck td{padding:6px 8px;border-bottom:1px solid var(--line-soft);color:var(--ink-dim)}
.footer-note{margin-top:40px;padding-top:14px;border-top:1px solid var(--line-soft);color:var(--ink-faint);font-size:11px}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto;display:flex;flex-wrap:wrap;padding:10px}
  nav.navlist{flex-direction:row;flex-wrap:wrap;padding:4px}
  .brand{width:100%;border-bottom:none}
  main{padding:18px}
  .kv{grid-template-columns:130px 1fr}
}

 prereq:[5012,5031,5032],rep:2500,repeat:"einmalig",cooldown:"–",
 tags:["Travel"],
 dialog:{an:"Die drei Außenstationen sind versorgt. Jetzt solltest du zu Dr. Sokolova nach Alexandria zurückkehren und ihr berichten, dass alle Lieferungen angekommen sind, <>.",
  offen:"Dr. Sokolova wartet noch auf deine Rückmeldung, <>. Kehr nach Alexandria zurück und sag ihr, dass die Kliniken versorgt sind.",
  ab:"Du bist wieder da. Gut. Ich habe bereits Nachricht von den anderen Stationen bekommen – überall ist das Material angekommen. Das war eine weite Strecke, <>. Danke, dass du dich darum gekümmert hast."},
 objectiveText:"Travel zurück zu Dr. Sokolova.", objectiveExtra:[],
 delivery:null,
 reward:{items:[{q:1,n:"InediaPain_FirstAidCase_Black"}],rep:200},
 technical:[], note:null, status:"final"},

{id:5008,title:"Vertrauliches Gespräch",npc:901,
 giver:npcLabel(901),turnIn:npcLabel(916),
 prereq:[5007,5100,5012,5031,5032],rep:3000,repeat:"einmalig",cooldown:"–",
 tags:["Übergangsquest","Illegal"],
 dialog:{an:"<>... bleib noch einen Moment. Es gibt Dinge, über die ich nicht mit jedem hier spreche. Du hast inzwischen oft genug bewiesen, dass ich dir vertrauen kann. In Krest lebt ein Mann namens Sergej. Er beschafft Dinge, die du in keiner gewöhnlichen Apotheke finden wirst. Nimm das hier zu ihm. Wenn er sieht, was du ihm bringst, wird er wissen, dass ich dich geschickt habe.",
  offen:"Sergej wartet in Krest auf dich, <>. Und ein Rat: Stell dort nicht mehr Fragen als nötig. Manche Geschäfte funktionieren besser, wenn man nicht jedes Detail kennt.",
  ab:"Gut. Dann hast du Sergej kennengelernt. Von jetzt an weißt du selbst, wo du suchen musst, wenn die gewöhnlichen Wege nicht mehr ausreichen. Aber vergiss nicht, <> – manches, was dort gehandelt wird, sollte besser nicht offen in Alexandria herumliegen."},
 objectiveText:"Abgabe bei Sergej (916) in Krest.", objectiveExtra:[],
 delivery:[{q:1,n:"iM7s_erlenmeyer"},{q:1,n:"iM7s_Bong_Clear"},{q:10,n:"iM7s_Psilocybin_MysticVoid"},{q:1,n:"iM7s_cylinder_a"}],
 reward:{items:[{q:2,n:"iM7s_Backwoodz_3pk"},{q:1,n:"iM7s_Blunt_BabyBatter"},{q:1,n:"iM7s_Blunt_Paragon"}],rep:250},
 technical:[], note:"Übergangsquest von Dr. Sokolova zu Sergej – Einstieg in die illegale Questlinie. Gesamt-Reputation Dr. Sokolova: 910 Rep.",
 status:"final"},

{id:5024,title:"Der erste Spatenstich",npc:911,
 giver:npcLabel(911),turnIn:npcLabel(911),
 prereq:[5023],rep:0,repeat:"einmalig",cooldown:"–",
 tags:["Action"],
 dialog:{an:"Vom Jagen und Plündern allein wird auf Dauer niemand satt, <>. Wer weiß, wie man etwas anbaut, hat wenigstens ein Stück seines Lebens selbst in der Hand. Komm, fang mit ein paar Samen an. Ich zeig dir, wie es geht.",
  offen:"Na, <>? Die Erde wartet nicht ewig. Bring die Samen rein und lass ihnen ein bisschen Zeit.",
  ab:"Siehst du? Gar nicht so schwer. Jetzt heißt es warten, pflegen und irgendwann ernten. Und wenn mehr wächst, als du selbst brauchst, weißt du ja, wo du mich findest."},
 objectiveText:"Action-Objective: 18x Aktion „ActionPlantSeed“.", objectiveExtra:[],
 delivery:null,
 reward:{items:[{q:1,n:"FarmingHoe"},{q:1,n:"GardenLime"},{q:1,n:"PumpkinSeedsPack"},{q:1,n:"TomatoSeedsPack"},{q:1,n:"ZucchiniSeedsPack"},{q:1,n:"PepperSeedsPack"}],rep:150},
 technical:["Aktion: ActionPlantSeed × 18"], note:null, status:"final"},

{id:5025,title:"Ernte für Alexandria",npc:911,
 giver:npcLabel(911),turnIn:npcLabel(911),
 prereq:[5024],rep:0,repeat:"wiederholbar",cooldown:"Kein Cooldown",
 tags:["Delivery"],
 dialog:{an:"Dein erstes Beet sollte inzwischen etwas hergeben, <>. Bring mir einen Teil deiner Ernte und etwas Gartenkalk. Was du nicht selbst brauchst, können wir hier gut gebrauchen.",
  offen:"Da fehlt noch etwas von der Ernte, <>. Ein Garten braucht Geduld – und manchmal eben noch eine zweite Runde.",
  ab:"Das sieht doch ordentlich aus. Frisch aus der Erde und nicht aus irgendeiner verrosteten Dose. Hier, nimm das für den nächsten Anbau."},
 objectiveText:null, objectiveExtra:[],
 delivery:[{q:5,n:"Pumpkin"},{q:5,n:"Tomato"},{q:5,n:"Zucchini"},{q:5,n:"GreenBellPepper"},{q:2,n:"GardenLime"}],
 reward:{items:[{q:1,n:"PumpkinSeedsPack"},{q:1,n:"TomatoSeedsPack"},{q:1,n:"ZucchiniSeedsPack"},{q:1,n:"PepperSeedsPack"},{q:1,n:"Sickle"}],rep:100},
 technical:[], note:null, status:"final"},

{id:5026,title:"Platz zum Wachsen",npc:911,
 giver:npcLabel(911),turnIn:npcLabel(911),
 prereq:[5025],rep:0,repeat:"einmalig",cooldown:"–",
 tags:["Delivery"],
 dialog:{an:"Für ein paar Pflanzen reicht ein Stück offene Erde. Wenn du aber wirklich regelmäßig anbauen willst, brauchst du etwas Ordentliches, <>. Bring mir Holz, Nägel und einen Hammer. Dann sorgen wir dafür, dass deine Pflanzen einen festen Platz bekommen.",
  offen:"Uns fehlt noch Material für das Pflanzbeet, <>. Mit ein paar losen Brettern lässt sich schlecht etwas Vernünftiges bauen.",
  ab:"So gefällt mir das schon besser. Ein ordentliches Beet, etwas Pflege und genug Geduld – mehr braucht es für den Anfang nicht."},
 objectiveText:null, objectiveExtra:[],
 delivery:[{q:15,n:"WoodenPlank"},{q:2,n:"NailBox"},{q:1,n:"Hammer"}],
 reward:{items:[{q:2,n:"mmg_planter_box_kit"}],rep:200},
 technical:[], note:null, status:"final"},

{id:5027,title:"Unter Glas",npc:911,
 giver:npcLabel(911),turnIn:npcLabel(911),
 prereq:[5026],rep:1000,repeat:"einmalig",cooldown:"–",
 tags:["Delivery"],
 dialog:{an:"Du hast inzwischen verstanden, wie wichtig ein guter Anbauplatz ist, <>. Aber draußen sind wir immer noch vom Wetter abhängig. Mit einem Gewächshaus sieht die Sache anders aus. Dafür brauche ich allerdings deutlich mehr Material.",
  offen:"Für ein Gewächshaus fehlt noch einiges, <>. Wenn wir das machen, dann richtig – sonst fällt uns das Ding beim ersten Sturm auseinander.",
  ab:"Wunderschön. Jetzt haben Wind und Wetter deutlich weniger mitzureden. Damit können wir Pflanzen ziehen, um die wir uns draußen kaum kümmern könnten."},
 objectiveText:null, objectiveExtra:[],
 delivery:[{q:50,n:"WoodenPlank"},{q:4,n:"NailBox"},{q:10,n:"MetalPlate"},{q:1,n:"Hammer"},{q:1,n:"HandSaw"}],
 reward:{items:[{q:1,n:"mmg_greenhouse_kit"}],rep:350},
 technical:[], note:null, status:"final"},

{id:5028,title:"Erste Hanfsamen",npc:911,
 giver:npcLabel(911),turnIn:npcLabel(911),
 prereq:[5027],rep:1000,repeat:"einmalig",cooldown:"–",
 tags:["Übergang Illegal","Illegal"],
 dialog:{an:"<>... du hast inzwischen gezeigt, dass du mit Pflanzen umgehen kannst. Und, noch wichtiger, dass du nicht wegen jeder Kleinigkeit durch ganz Alexandria läufst und Geschichten erzählst. Es gibt da noch etwas, das in einem Gewächshaus ziemlich gut wächst. Besorg mir vorher ein paar Sachen – und was danach passiert, bleibt zwischen uns.",
  offen:"Noch nicht alles beisammen, <>? Kein Problem. Bei manchen Dingen lohnt es sich, nichts zu überstürzen.",
  ab:"Gut. Dann pass auf diese Samen besonders gut auf. Sie sind nicht gerade etwas, das ich hier offen auf dem Tisch liegen lassen würde. Und wem du davon erzählst, solltest du dir sehr genau überlegen."},
 objectiveText:"Übergang zur illegalen Seite.", objectiveExtra:[],
 delivery:[{q:3,n:"GardenLime"},{q:1,n:"Pitchfork"},{q:1,n:"FarmingHoe"}],
 reward:{items:[{q:1,n:"iM7s_SeedPack_Gelato"}],rep:150},
 technical:[], note:null, status:"final"},

{
 "id": 5030,
 "title": "Sauber verpackt",
 "npc": 911,
 "giver": "Lise Baumann (911)",
 "turnIn": "Lise Baumann (911)",
 "prereq": [
  5029
 ],
 "rep": 1000,
 "repeat": "einmalig",
 "cooldown": "–",
 "tags": [
  "Delivery",
  "Kapitel-Abschluss",
  "Illegal",
  "Crafting"
 ],
 "dialog": {
  "an": "Beim Anbauen hört die Arbeit nicht auf, <>.\n\nEine gute Ernte bringt wenig, wenn du nicht weißt, was du danach damit anfängst.\n\nDie Gärtnerin nimmt einen Bud in die Hand.\n\nDu hast inzwischen mit Gelato und Blue Cookies gearbeitet. Jetzt zeige ich dir noch, wie du daraus kleinere Portionen machst.\n\nSie legt ein Messer daneben.\n\nDas Rezept ist einfach.\n\nEin Bud und ein passendes Messer ergeben 14 Small Nugs derselben Sorte.\n\nGelato bleibt Gelato. Blue Cookies bleiben Blue Cookies.\n\nAlso nicht wild durcheinanderwerfen.\n\nSie sieht dich kurz an.\n\nIch will von dir jeweils dreißig Stück.\n\n30 Small Nugs Gelato und 30 Small Nugs Blue Cookies.\n\nDafür musst du deine Buds entsprechend verarbeiten.\n\nWenn du das sauber hinbekommst, habe ich dir über den Anbau und die Verarbeitung wirklich alles gezeigt, was ich kann.",
  "offen": "Noch nicht genug vorbereitet, <>.\n\nEin Bud mit einem passenden Messer ergibt 14 Small Nugs derselben Sorte.\n\nIch brauche 30 Gelato Small Nugs und 30 Blue Cookies Small Nugs.\n\nUnd denk dran – die Sorten nicht mischen.",
  "ab": "Sehr schön.\n\nDie Gärtnerin nimmt sich ein paar der Small Nugs und betrachtet sie.\n\nGelato sauber getrennt. Blue Cookies ebenfalls.\n\nGenau so soll es sein.\n\nAus einem guten Bud wird mit einem passenden Messer schnell eine brauchbare kleinere Portion – solange man weiß, was man tut.\n\nSie nimmt einen der Small Nugs in die Hand.\n\nUnd bevor du gehst, noch ein letztes Rezept.\n\nSie legt eine Backwoodz Cigar daneben.\n\nEine Backwoodz Cigar und drei Small Nugs derselben Sorte ergeben einen gerollten Blunt.\n\nDrei Nugs. Eine Sorte.\n\nGelato bleibt Gelato. Blue Cookies bleiben Blue Cookies.\n\nSie schiebt dir die Backwoodz-Packungen zu.\n\nDamit kannst du es selbst ausprobieren.\n\nAnbauen, ernten, verarbeiten und am Ende sogar etwas daraus machen.\n\nMehr muss ich dir darüber wohl nicht mehr beibringen, <>.\n\nDer Rest liegt jetzt bei dir."
 },
 "objectiveText": "Stelle 30 Gelato Small Nugs und 30 Blue Cookies Small Nugs her und bring sie der Gärtnerin.",
 "objectiveExtra": [
  "Rezept: 1 Bud + passendes Vanilla-Messer = 14 Small Nugs derselben Sorte.",
  "Nach Abschluss gelernt: 1 Backwoodz Cigar + 3 Small Nugs derselben Sorte = 1 Blunt derselben Sorte.",
  "Voraussetzung für 5203."
 ],
 "delivery": [
  {
   "q": 30,
   "n": "iM7s_SmallNug_Gelato"
  },
  {
   "q": 30,
   "n": "iM7s_SmallNug_BlueCookies"
  }
 ],
 "reward": {
  "items": [
   {
    "q": 2,
    "n": "iM7s_Backwoodz_3pk"
   }
  ],
  "rep": 200
 },
 "technical": [
  "Small Nugs werden nicht automatisch gegeben; Spieler stellt sie selbst her."
 ],
 "note": "Kapitel-Abschluss der Gärtnerin-Reihe. Gesamt-Reputation Gärtnerin: 1350 Rep.",
 "status": "final"
},

{id:5003,title:"Frisches Fleisch",npc:906,
 giver:npcLabel(906),turnIn:npcLabel(906),
 prereq:[5023],rep:0,repeat:"wiederholbar",cooldown:"Kein Cooldown",
 tags:["Delivery"],
 dialog:{an:"Wenn du draußen sowieso unterwegs bist, kannst du dich auch nützlich machen, <>. Kaninchen, Fuchs – was du findest. Bring mir brauchbares Fleisch, Knochen und Gedärme. Hier wird nichts verschwendet.",
  offen:"Na, <>? Noch nichts Brauchbares vor die Flinte bekommen? Ich brauche die Beute noch.",
  ab:"Saubere Arbeit. Fleisch für den Topf, der Rest wird ebenfalls verwertet. Genau so jagt man, wenn man nichts verschwenden kann."},
 objectiveText:null, objectiveExtra:[],

 reward:{items:[],rep:50,note:"Kein Item-Reward"},
 technical:[], note:null, status:"final"},

{id:5005,title:"Schlachtvieh",npc:906,
 giver:npcLabel(906),turnIn:npcLabel(906),
 prereq:[5023],rep:0,repeat:"wiederholbar",cooldown:"Kein Cooldown",
 tags:["Delivery"],
 dialog:{an:"Nicht jede Mahlzeit muss aus dem Wald kommen, <>. Vieh bringt mehr Fleisch auf einmal und versorgt uns länger. Bring mir brauchbare Stücke, Knochen und Innereien.",
  offen:"Ich brauche noch mehr vom Vieh, <>. Ein halbleerer Vorrat bringt uns nicht weit.",
  ab:"Das reicht erstmal. Gute Ausbeute und kaum etwas davon geht verloren. So muss es sein."},
 objectiveText:null, objectiveExtra:[],
 delivery:[{q:10,n:"CowSteakMeat"},{q:10,n:"PigSteakMeat"},{q:15,n:"Bone"},{q:3,n:"Guts"}],

{id:5013,title:"Fell und Leder",npc:906,

 prereq:[5023],rep:0,repeat:"wiederholbar",cooldown:"Kein Cooldown",
 tags:["Delivery"],

  offen:"Mir fehlen noch Felle und Leder, <>. Wenn du schon jagst, dann nutz das Tier auch richtig.",
  ab:"Gute Qualität. Damit kann man arbeiten. Hier – hast du dir verdient."},
 objectiveText:null, objectiveExtra:[],

{id:5014,title:"Der Hirsch",npc:906,
 giver:npcLabel(906),turnIn:npcLabel(906),
 prereq:[5023],rep:1000,repeat:"einmalig",cooldown:"–",
 tags:["Target"],
 dialog:{an:"Fleisch anschleppen kann jeder, der lange genug sucht, <>. Aber ein Hirsch lässt dich nicht einfach an sich heran. Wenn du wirklich jagen kannst, dann zeig es mir. Fünf Stück. Sauber erlegt.",
  offen:"Fünf Hirsche waren abgemacht, <>. Du bist noch nicht fertig.",
  ab:"Nicht schlecht. Einen Hirsch zu erwischen ist eine Sache – fünf sind kein Zufall mehr. Du kannst tatsächlich mit einer Waffe umgehen."},
 objectiveText:"Target-Objective: 5x Hirsch (Animal_CervusElaphus / _F).", objectiveExtra:[],
 delivery:null,
 reward:{items:[{q:1,n:"My_DF_Weapons_Snipers_M700"},{q:1,n:"LongrangeOptic"},{q:1,n:"FOG_GhillieAtt_Pine"},{q:1,n:"My_DF_Weapons_Snipers_M700_5RndMag"},{q:1,n:"My_DF_Weapons_Attachments_barrel_R93Short"}],rep:200},
 technical:["Ziel: Animal_CervusElaphus / Animal_CervusElaphus_F"], note:null, status:"final"},

{id:5015,title:"Die Wölfe",npc:906,
 giver:npcLabel(906),turnIn:npcLabel(906),
 prereq:[5014],rep:2500,repeat:"einmalig",cooldown:"–",
 tags:["Target"],
 dialog:{an:"Hirsche laufen weg. Wölfe kommen auf dich zu – das ist ein Unterschied, <>. In der Gegend zieht ein Rudel herum und wird langsam zu dreist. Dünn es aus. Zehn sollten reichen, damit der Rest Abstand hält.",
  offen:"Die Wölfe sind noch immer da draußen, <>. Solange das Rudel groß genug ist, bleibt es eine Gefahr.",
  ab:"Gut. Das Rudel wird sich eine Weile von den Leuten fernhalten. Gegen Wölfe bestehen nicht viele so ruhig wie gegen Wild. Das merke ich mir."},
 objectiveText:"Target-Objective: 10x Wolf (Animal_CanisLupus_Grey / _White).", objectiveExtra:[],
 delivery:null,
 reward:{items:[{q:1,n:"My_DF_Weapons_Shotguns_Citori725"},{q:1,n:"Handguard Citori725_Tac"},{q:1,n:"Stock Citori725Tac"},{q:1,n:"Trigger 725Twostage"},{q:1,n:"Muzzle Citori725"},{q:1,n:"AmmoBox 12Gauge_Dragon_100Rnd"},{q:1,n:"My_DF_Weapons_Pistols_Shockpistol"}],rep:300},
 technical:["Ziel: Animal_CanisLupus_Grey / Animal_CanisLupus_White"], note:null, status:"final"},

{id:5016,title:"Der Bär",npc:906,
 giver:npcLabel(906),turnIn:npcLabel(906),
 prereq:[5015],rep:5000,repeat:"einmalig",cooldown:"–",
 tags:["Target","Kapitel-Abschluss"],
 dialog:{an:"Du hast Hirsche gejagt und ein Wolfsrudel ausgedünnt. Also erspare ich dir jetzt die leichten Aufgaben, <>. Im Wald streift ein Bär herum. Groß, aggressiv und viel zu nah an unseren Wegen. Selbst ich würde mir zweimal überlegen, ihm allein nachzugehen. Wenn du es trotzdem versuchen willst – dann geh vorbereitet.",
  offen:"Der Bär lebt noch, <>. Unterschätz ihn nicht. Ein einziger Fehler, und du wirst Teil des Waldes.",
  ab:"Du hast ihn tatsächlich erwischt. Einen Bären allein zur Strecke zu bringen, verlangt mehr als nur eine ruhige Hand. Ab heute muss mir niemand mehr erzählen, dass du kein Jäger bist. Nimm das – du hast es dir verdient."},
 objectiveText:"Target-Objective: 1x Bär (Animal_UrsusArctos).", objectiveExtra:[],
 delivery:null,
 reward:{items:[{q:1,n:"My_DF_Weapons_Snipers_M82"},{q:1,n:"Optic ThermalAdditive"},{q:1,n:"Optic IndicatorAdditive"},{q:1,n:"Flashkill"},{q:1,n:"Stock M82LT"},{q:1,n:"Handguard M82_Short"},{q:1,n:"Bipod M82_Bip"},{q:1,n:"My_DF_Weapons_Snipers_M82_5RndMag"}],rep:600},
 technical:["Ziel: Animal_UrsusArctos"], note:"Kapitel-Abschluss der Jäger-Reihe. Gesamt-Reputation Jäger: 1250 Rep.", status:"final"},

{id:5034,title:"Strom für den Sender",npc:908,
 giver:npcLabel(908),turnIn:npcLabel(908),
 prereq:[5023],rep:500,repeat:"wiederholbar",cooldown:"Kein Cooldown",
 tags:["Delivery"],
 dialog:{an:"Der beste Sender der Welt bringt uns nichts, wenn ihm der Strom ausgeht, <>. Batterien gehen hier schneller drauf, als mir lieb ist. Bring mir Nachschub und ein Ladegerät, damit ich die Geräte weiter betreiben kann.",
  offen:"Mir fehlt noch die Stromversorgung, <>. Wenn der Sender ausfällt, sind wir für eine Weile taub.",
  ab:"Sehr gut. Damit kann ich den Betrieb erstmal aufrechterhalten. Solange der Sender läuft, wissen wir wenigstens, was da draußen passiert."},
 objectiveText:null, objectiveExtra:[],
 delivery:[{q:3,n:"Battery9V"},{q:1,n:"BatteryCharger"}],
 reward:{items:[{q:1,n:"SpaghettiCan"},{q:1,n:"WaterBottle"}],rep:50},
 technical:[], note:null, status:"final"},

{id:5039,title:"Ausrüstung für den Funkbetrieb",npc:908,
 giver:npcLabel(908),turnIn:npcLabel(908),
 prereq:[5034],rep:800,repeat:"wiederholbar",cooldown:"Kein Cooldown",
 tags:["Delivery"],
 dialog:{an:"Strom allein reicht nicht, <>. Die Geräte werden ständig herumgetragen, beschädigt oder notdürftig geflickt. Ich brauche ein Case, ein paar Handfunkgeräte und genügend Klebeband, damit mir der Funkbetrieb nicht Stück für Stück auseinanderfällt.",
  offen:"Für den Funkbetrieb fehlt mir noch Ausrüstung, <>. Ohne Ersatzmaterial wird aus einer kleinen Störung schnell ein kompletter Ausfall.",
  ab:"Genau das habe ich gebraucht. Damit kann ich die Geräte schützen, austauschen und zur Not wieder zusammenflicken. Gute Arbeit, <>."},
 objectiveText:null, objectiveExtra:[],
 delivery:[{q:1,n:"SmallProtectorCase"},{q:2,n:"PersonalRadio"},{q:5,n:"DuctTape"}],
 reward:{items:[{q:1,n:"My_DF_Weapons_Pistols_Shockpistol"},{q:2,n:"My_DF_Weapons_Pistols_Shockpistol_2RndMag"}],rep:60},
 technical:[], note:null, status:"final"},

{id:5035,title:"Reichweite verbessern",npc:908,
 giver:npcLabel(908),turnIn:npcLabel(908),
 prereq:[5039],rep:1500,repeat:"einmalig",cooldown:"–",
 tags:["Delivery"],
 dialog:{an:"Der Sender läuft stabil, aber unsere Reichweite ist noch miserabel, <>. Zu oft bekomme ich nur Rauschen oder halbe Sätze herein. Mit etwas Elektrowerkzeug, Kabel und einem weiteren Funkgerät kann ich die Anlage aufrüsten.",
  offen:"Für die Aufrüstung fehlt mir noch Material, <>. Solange das nicht da ist, bleibt hinter dem Rauschen vieles verborgen.",
  ab:"Das sollte einen deutlichen Unterschied machen. Das Signal ist sauberer und die Reichweite größer. Vielleicht hören wir jetzt endlich auch die Stationen, die bisher außerhalb unserer Reichweite lagen."},

 delivery:[{q:1,n:"ElectronicRepairKit"},{q:2,n:"MetalWire"},{q:1,n:"PersonalRadio"}],

{id:5036,title:"Funkturm Polonina",npc:908,
 giver:npcLabel(908),turnIn:npcLabel(917),
 prereq:[5035],rep:1500,repeat:"einmalig",cooldown:"–",
 tags:["Delivery"],
 dialog:{an:"Seit ein paar Tagen kommt vom Polonina-Turm kaum noch ein brauchbares Signal herein, <>. Marek Vosko ist bereits vor Ort, aber ihm fehlt Material für die Reparatur. Bring ihm, was er braucht.",
  offen:"Marek wartet am Polonina-Turm noch auf das Material, <>. Solange der Turm ausfällt, fehlt uns dort ein wichtiges Stück Reichweite.",
  ab:"Das Signal von Polonina ist wieder da – klar und stabil. Gute Arbeit, <>. Ein blinder Fleck weniger."},
 objectiveText:"Abgabe bei Techniker Marek Vosko (917), Funkturm Polonina.", objectiveExtra:[],
 delivery:[{q:1,n:"ElectronicRepairKit"},{q:1,n:"DuctTape"},{q:2,n:"Battery9V"}],
 reward:{items:[{q:2,n:"RA_CodeLock"}],rep:75},
 technical:[], note:null, status:"final"},

{id:5037,title:"Funkturm Erbenka",npc:908,
 giver:npcLabel(908),turnIn:npcLabel(918),
 prereq:[5035],rep:1500,repeat:"einmalig",cooldown:"–",
 tags:["Delivery"],
 dialog:{an:"Erbenka macht ebenfalls Probleme, <>. Pavlo Semak versucht den Turm am Leben zu halten, aber ohne Ersatzmaterial kommt er nicht weiter. Bring ihm die Sachen und hilf uns, die Verbindung wiederherzustellen.",
  offen:"Pavlo wartet noch auf das Material für Erbenka, <>. Der Turm bleibt solange praktisch nutzlos.",
  ab:"Erbenka sendet wieder. Das Signal ist nicht schön, aber stabil – und darauf kommt es an. Gute Arbeit, <>."},
 objectiveText:"Abgabe bei Techniker Pavlo Semak (918), Funkturm Erbenka.", objectiveExtra:[],
 delivery:[{q:1,n:"ElectronicRepairKit"},{q:2,n:"Rope"},{q:1,n:"BatteryCharger"}],
 reward:{items:[{q:2,n:"iM7s_Brake_Fluid"},{q:1,n:"iM7s_Battery_Acid_01"}],rep:75},
 technical:[], note:null, status:"final"},

{id:5038,title:"Funkturm Olsha",npc:908,
 giver:npcLabel(908),turnIn:npcLabel(919),
 prereq:[5035],rep:1500,repeat:"einmalig",cooldown:"–",
 tags:["Delivery"],
 dialog:{an:"Olsha ist der letzte große blinde Fleck in unserem Netz, <>. Radoslav Kunc ist dort und weiß, was zu tun ist – ihm fehlt nur das nötige Material. Wenn wir diesen Turm wieder ans Netz bekommen, sieht die Lage deutlich besser aus.",
  offen:"Radoslav wartet noch am Olsha-Turm auf dich, <>. Solange der nicht läuft, bleibt eine Lücke in unserem Funknetz.",
  ab:"Olsha ist wieder online. Damit haben wir alle drei Türme zurück im Netz. Jetzt kann ich endlich wieder deutlich weiter lauschen als bis zum nächsten Hügel."},
 objectiveText:"Abgabe bei Techniker Radoslav Kunc (919), Funkturm Olsha.", objectiveExtra:[],
 delivery:[{q:1,n:"PersonalRadio"},{q:1,n:"CarBattery"},{q:2,n:"MetalWire"}],
 reward:{items:[{q:1,n:"mmg_palette_storage_kit"},{q:1,n:"mmg_fridge_kit_blue"}],rep:75},
 technical:[], note:null, status:"final"},

{id:5040,title:"Der Kontakt",npc:908,
 giver:npcLabel(908),turnIn:npcLabel(920),
 prereq:[5036,5037,5038],rep:1500,repeat:"einmalig",cooldown:"–",
 tags:["Übergangsquest","Illegal"],
 dialog:{an:"Seit die Türme wieder laufen, bekomme ich deutlich mehr mit als vorher, <>. Nicht alles davon gehört auf einen offiziellen Kanal. Über eine dieser Verbindungen bin ich auf einen Mann namens Lewis Brenner gestoßen. Er sitzt bei der Metro und besorgt Dinge, die du auf keinem gewöhnlichen Markt findest. Bring ihm das hier. Dann weiß er, dass du über den richtigen Kontakt kommst.",
  offen:"Lewis wartet bei der Metro auf dich, <>. Wenn du dort bist, erwähn meinen Namen besser nicht lauter als nötig. Manche Kontakte bleiben länger nützlich, wenn nicht jeder von ihnen weiß.",
  ab:"Dann hast du Lewis also gefunden. Gut. Jetzt kennst du den Weg zum Pfandhaus – und ab hier entscheidest du selbst, welche Geschäfte du dort machst."},
 objectiveText:"Abgabe bei Lewis Brenner, Metro (920).", objectiveExtra:[],
 delivery:[{q:1,n:"ExpansionCircuitBoard_MK1"},{q:1,n:"BaseRadio"}],
 reward:{items:[],rep:100,note:"Kein Item-Reward"},
 technical:[], note:"Übergangsquest von der Funkerin zu Lewis Brenner/Pfandhaus – Einstieg in die illegale Questlinie. Gesamt-Reputation Funkerin: 635 Rep.",
 status:"final"},

/* ---------- MECHANIKER GRIGORI FEDEROV (907) → VITALI (921) ---------- */
{id:5041,title:"Werkstattbedarf",npc:907,
 giver:npcLabel(907),turnIn:npcLabel(907),
 prereq:[5023],rep:0,repeat:"wiederholbar",cooldown:"Kein Cooldown",
 tags:["Delivery"],
 dialog:{an:"Wenn du dich hier öfter rumtreiben willst, kannst du dich auch gleich nützlich machen, <>. In einer Werkstatt verschwinden Lumpen, Sprit und Werkzeug schneller als Bier bei einem Mechanikertreffen. Bring mir ein paar brauchbare Sachen. Müssen nicht schön sein – schön fährt sowieso nicht.",
  offen:"Mir fehlt immer noch Werkstattbedarf, <>. Lumpen, Sprit, Werkzeug – irgendwas davon liegt da draußen immer rum. Meistens direkt neben einem Auto, das nie wieder fahren wird.",
  ab:"Ja, genau so was brauch ich. Damit kann ich wenigstens wieder arbeiten, ohne alles mit dem Ärmel abzuwischen. Hier, nimm das Flickzeug. Glaub mir: Reifen gehen immer genau dann kaputt, wenn weit und breit keine Werkstatt in Sicht ist."},
 objectiveText:null, objectiveExtra:[],
 delivery:[{q:12,n:"Rag"},{q:1,n:"CanisterGasoline"},{q:1,n:"Hacksaw"}],
 reward:{items:[{q:1,n:"TireRepairKit"}],rep:50},
 technical:[], note:null, status:"final"},

{id:5042,title:"Werkzeug für die Werkbank",npc:907,
 giver:npcLabel(907),turnIn:npcLabel(907),
 prereq:[5041],rep:200,repeat:"einmalig",cooldown:"–",
 tags:["Delivery"],
 dialog:{an:"Mit Lumpen und Sprit krieg ich viel hin, <>. Aber irgendwann muss selbst ich zugeben, dass ein Schraubenschlüssel besser funktioniert als ein Stein. Bring mir ordentliches Werkzeug: Schraubenschlüssel, Schraubenzieher, Zangen – alles, womit man Dinge auseinanderbekommt und mit etwas Glück wieder zusammen.",
  offen:"Das Werkzeug ist noch nicht komplett, <>. Ich kann viel improvisieren, aber einen Bolzen mit den Zähnen festziehen sieht nur in Geschichten gut aus.",
  ab:"Ah, sieh an. Richtiges Werkzeug. Fast schon Luxus. Damit kann man arbeiten, ohne jedes zweite Gewinde persönlich zu beleidigen. Ich hab hinten noch ein paar Fahrzeugteile gefunden. Nimm sie mit – bevor ich wieder vergesse, wo ich sie hingelegt hab."},
 objectiveText:null, objectiveExtra:[],
 delivery:[{q:1,n:"Wrench"},{q:1,n:"Screwdriver"},{q:1,n:"Pliers"},{q:1,n:"PipeWrench"},{q:1,n:"LugWrench"}],
 reward:{items:[{q:1,n:"CarBattery"},{q:1,n:"SparkPlug"},{q:2,n:"HeadlightH7"}],rep:100},
 technical:[], note:null, status:"final"},

{id:5043,title:"Strom und Ersatzteile",npc:907,
 giver:npcLabel(907),turnIn:npcLabel(907),
 prereq:[5042],rep:200,repeat:"einmalig",cooldown:"–",
 tags:["Delivery"],
 dialog:{an:"Werkzeug haben wir. Jetzt fehlt uns nur noch das Übliche: Strom, Draht und genug Metall, um aus Schrott wieder neuen Schrott zu bauen, <>. Besorg mir einen Generator, etwas Draht und ein paar brauchbare Stücke Metall. Wie es aussieht, ist mir egal. Rost ist schließlich auch nur Farbe mit Charakter.",
  offen:"Generator, Draht und Schrott, <>. Solange das Zeug fehlt, steht hier die Hälfte still. Und eine stehende Werkstatt ist nur ein sehr dreckiger Lagerraum.",
  ab:"Sehr gut. Jetzt sieht das hier langsam tatsächlich nach einer Werkstatt aus und nicht mehr nach einem Unfall mit Werkzeug. Hier, nimm die Lötlampe und die Gaskartuschen. Die wirst du gleich brauchen. Für das nächste Projekt ist mir hier nämlich zu wenig Platz. Mein Bruder Vitali hat draußen am Schrottplatz genug davon. Zu viel, wenn du mich fragst."},
 objectiveText:null, objectiveExtra:[],
 delivery:[{q:1,n:"MetalWire"},{q:1,n:"PowerGenerator"},{q:6,n:"scrapmetal"}],
 reward:{items:[{q:1,n:"Blowtorch"},{q:2,n:"LargeGasCanister"}],rep:200},
 technical:[], note:null, status:"final"},

{id:5044,title:"Die Werkbank",npc:907,
 giver:npcLabel(907),turnIn:npcLabel(921),
 prereq:[5043],rep:300,repeat:"einmalig",cooldown:"–",
 tags:["Delivery","Übergangsquest"],
 dialog:{an:"Jetzt wird's interessant, <>. Für eine vernünftige Werkbank fehlt mir hier vor allem eins: Platz. Mein Bruder Vitali hat davon mehr als genug. Naja... wenn man die alten Achsen, Motorblöcke und den ganzen anderen Müll nicht mitzählt. Bring ihm Metallplatten, Schrott und die Lötlampe. Sag ihm, dass du von mir kommst. Dann motzt er vielleicht nur halb so viel.",
  offen:"Vitali wartet am Schrottplatz auf das Material, <>. Und wenn er behauptet, ich hätte ihm noch Geld geschuldet: Hör einfach nicht hin.",
  ab:"Ah, Grigori schickt dich also. Hätte ich mir denken können. Immer wenn Arbeit anfällt, findet mein Bruder plötzlich jemanden mit zwei gesunden Armen. Na gut – das Material taugt. Ich hab dir daraus alles für einen Werkbanksatz zusammengestellt. Bau das Ding auf. Danach kannst du anfangen, richtig Unsinn mit Metall zu machen."},
 objectiveText:"Delivery, Abgabe bei 921 (Vitali). Übergang zu Vitali.", objectiveExtra:[],
 delivery:[{q:10,n:"MetalPlate"},{q:5,n:"scrapmetal"},{q:1,n:"Blowtorch"}],
 reward:{items:[{q:1,n:"Zen_CarWorkbenchKit"}],rep:250},
 technical:[], note:"Übergangsquest von Grigori Federov zu Vitali „Ölfinger“ Federov.", status:"final"},

{id:5045,title:"Material für den Aufbau",npc:921,
 giver:npcLabel(921),turnIn:npcLabel(921),
 prereq:[5044],rep:200,repeat:"einmalig",cooldown:"–",
 tags:["Delivery"],
 dialog:{an:"Na, <>? Hast du dir die alte Mühle da drüben schon angesehen? Ja, ich weiß, sie sieht aus, als hätte sie drei Kriege und zwei Besitzer mit Führerschein überlebt. Aber der Rahmen ist noch brauchbar. Bring mir Metallplatten, Rohre, Schrott und Stoff. Dann sehen wir mal, ob wir aus dem Haufen wieder ein Auto machen – oder wenigstens etwas, das bergab sehr überzeugend rollt.",
  offen:"Für den Aufbau fehlt noch Material, <>. Blech, Rohre, Schrott und Stoff. Ohne das kann selbst ich nur davorstehen und fachmännisch nicken.",
  ab:"Jawoll, das reicht. Damit kann ich arbeiten. Ich hab den brauchbaren Rahmen vorbereitet und daraus einen Chassis-Bausatz gemacht. Hübsch ist anders, aber hübsch war auch nie das Ziel. Ein Chassis allein fährt allerdings keinen Meter. Jetzt kommen die Teile, bei denen es richtig dreckig wird."},
 objectiveText:"Geber/Abgabe: Vitali (921).", objectiveExtra:[],
 delivery:[{q:6,n:"MetalPlate"},{q:4,n:"Pipe"},{q:4,n:"scrapmetal"},{q:6,n:"Rag"}],
 reward:{items:[{q:1,n:"chassiskit"},{q:2,n:"engineparts"}],rep:300},
 technical:[], note:null, status:"final"},

{id:5046,title:"Teile für das Auto",npc:921,
 giver:npcLabel(921),turnIn:npcLabel(921),
 prereq:[5045],rep:1000,repeat:"einmalig",cooldown:"–",
 tags:["Delivery","Crafting"],
 dialog:{an:"Jetzt sind wir an dem Punkt, an dem Leute anfangen, so zu tun, als würden sie etwas von Autos verstehen, <>. Das Chassis steht. Was fehlt, sind Motor, Auspuff, Benzintank und Reifen. Und bevor du fragst: Nein, die liegen nicht zufällig fertig unter irgendeiner Plane. Die baust du selbst an der Werkbank.\n\nMotor bauen – Werkzeug: Schraubenschlüssel – Benötigt: 2x Motorteile, 2x Schrott, 2x Metallbleche – Ergebnis: 1x Motor\n\nAuspuff bauen – Werkzeug: Rohrzange – Benötigt: 2x Metallrohr, 1x Metallblech, 3x Stofffetzen – Ergebnis: 1x Auspuff\n\nBenzintank bauen – Werkzeug: Schraubenschlüssel – Benötigt: 3x Metallbleche, 2x Schrott, 1x Metallrohr – Ergebnis: 1x Benzintank\n\nReifen bauen – Werkzeug: Radmutternschlüssel – Benötigt: 1x Schrott, 2x Draht, 2x Stofffetzen – Ergebnis: 1x Reifen\n\nDas Prinzip ist einfach: Material in die Werkbank, passendes Werkzeug in die Hand und hoffen, dass du danach noch genauso viele Finger hast wie vorher. Bevor du loslegst, bring mir noch ein brauchbares Motorteil und etwas Schrott. Ich seh mir an, was davon zu retten ist.",
  offen:"Mir fehlen noch ein brauchbares Motorteil und etwas Schrott, <>. Bring beides her. Dann entscheide ich, ob es Ersatzteil oder Briefbeschwerer wird.",
  ab:"Ja, das taugt. Und stell dir vor: Zwischen dem ganzen Müll hier lagen tatsächlich noch ein brauchbarer Kühler, eine Batterie und eine Zündkerze. Fast so, als hätte ich ein System. Nimm das Zeug mit. Zusammen mit dem Chassis und den Teilen von der Werkbank fehlt der alten Mühle jetzt fast nichts mehr. Fast."},
 objectiveText:"Selbstbau an der Werkbank + Abgabe (siehe Technische Hinweise für Bau-Rezepte).", objectiveExtra:[],
 delivery:[{q:1,n:"engineparts"},{q:1,n:"scrapmetal"}],
 reward:{items:[{q:1,n:"CarBattery"},{q:1,n:"CarRadiator"},{q:1,n:"SparkPlug"}],rep:200},
 technical:[
   "Motor bauen – Werkzeug: Schraubenschlüssel – Benötigt: 2x Motorteile, 2x Schrott, 2x Metallbleche – Ergebnis: 1x Motor",
   "Auspuff bauen – Werkzeug: Rohrzange – Benötigt: 2x Metallrohr, 1x Metallblech, 3x Stofffetzen – Ergebnis: 1x Auspuff",
   "Benzintank bauen – Werkzeug: Schraubenschlüssel – Benötigt: 3x Metallbleche, 2x Schrott, 1x Metallrohr – Ergebnis: 1x Benzintank",
   "Reifen bauen – Werkzeug: Radmutternschlüssel – Benötigt: 1x Schrott, 2x Draht, 2x Stofffetzen – Ergebnis: 1x Reifen"
 ], note:null, status:"final"},

{id:5047,title:"Das Automobil",npc:921,
 giver:npcLabel(921),turnIn:npcLabel(921),
 prereq:[5046],rep:1000,repeat:"einmalig",cooldown:"–",
 tags:["Delivery","Kapitel-Abschluss"],
 dialog:{an:"Jetzt fehlt tatsächlich nur noch der letzte Schritt, <>. Das Chassis hast du, die Teile kannst du bauen und den Rest hab ich dir zusammengesucht. Was dir noch fehlt, ist ein Bauplan. Ohne Plan kannst du natürlich einfach alles irgendwie zusammenschrauben – machen erstaunlich viele. Fahren tut's danach nur meistens nicht.\n\nBring mir vier saubere Bögen Papier. Dann zeichne ich dir auf, was wohin gehört. Auf meinen alten Zetteln hier ist inzwischen mehr Öl als Schrift, und ehrlich gesagt weiß ich bei einem davon selbst nicht mehr, ob das ein Motor oder eine Einkaufsliste sein sollte.",
  offen:"Vier Bögen Papier, <>. Sauber, wenn's geht. Auf Ölflecken zeichnen kann ich selbst.",
  ab:"Perfekt. Gib her. So... Motor hier, Tank da, Auspuff nach hinten. Und die Reifen machst du am besten außen dran – kleiner Geheimtipp vom Fachmann. Hier ist dein Bauplan, <>. Du hast alles, was du brauchst. Mach was Vernünftiges aus der alten Mühle. Und wenn du sie am ersten Baum krummfährst, erzähl Grigori einfach, es war schon so."},
 objectiveText:null, objectiveExtra:[],
 delivery:[{q:4,n:"Paper"}],
 reward:{items:[{q:1,n:"blueprint_adaw"}],rep:200},
 technical:[], note:"Kapitel-Abschluss der Mechaniker-Reihe (907+921). Gesamt-Reputation Mechaniker-Reihe: 1300 Rep.", status:"final"},

/* ---------- MILIZIONÄR TIMUR BEK (909) → NIKOLAJ BATYA (922) → ALEXEI (923) ---------- */
{id:5101,title:"Ruhe vor dem Sturm",npc:909,
 giver:npcLabel(909),turnIn:npcLabel(909),
 prereq:[5002],rep:550,repeat:"einmalig",cooldown:"–",
 tags:["Travel","Sequential"],
 dialog:{an:"Miroslav meint, du willst dich hier nützlich machen, <>. Gut. Dann fangen wir mit etwas Einfachem an. Rund um Alexandria halten wir ein paar Außenposten besetzt. Normalerweise melden die sich regelmäßig – heute ist es verdächtig still geworden.\n\nGeh die Posten der Reihe nach ab und sieh nach dem Rechten. Wenn alles ruhig ist, umso besser. Wenn nicht, merk dir genau, was du siehst. Und spiel nicht den Helden – heute will ich Informationen, keine Leichen.",
  offen:"Du hast noch nicht alle Posten kontrolliert, <>. Geh die Runde zu Ende. Ich will wissen, warum es draußen plötzlich so verdammt ruhig geworden ist.",
  ab:"Der letzte Posten war leer? Verdammt... Meine Leute verschwinden nicht einfach mitten aus ihrer Schicht.\n\nWenn dort weder Verwundete noch Ausrüstung zurückgeblieben sind, ist irgendetwas passiert. Und ich bezweifle, dass sie freiwillig gegangen sind.\n\nGut, dass du nachgesehen hast, <>. Halt dich in meiner Nähe. Ich lasse prüfen, was auf dieser Strecke passiert ist – und wenn mein Verdacht stimmt, war das heute nur die Ruhe vor dem Sturm."},
 objectiveText:"4x sequenzielle Travel-Objectives.",
 objectiveExtra:["1. Außenposten Polesovo [6039.50, 219.61, 13368.60]","2. Pavlovo [1863.19, 177.82, 4419.15]","3. Solnechny [13351.49, 7.15, 6752.20]","4. Rückkehr zu Milizionär Timur Bek"],
 delivery:null,
 reward:{items:[{q:1,n:"My_DF_Weapons_AmmoBox_9x19_PSO_100Rnd"},{q:1,n:"My_DF_Weapons_AmmoBox_45ACP_AP_100Rnd"},{q:2,n:"BandageDressing"},{q:1,n:"Compass"}],rep:250},
 technical:["Tod bricht nicht ab","SequentialObjectives"], note:null, status:"final"},

{id:5102,title:"Die Banditenspur",npc:909,
 giver:npcLabel(909),turnIn:npcLabel(909),
 prereq:[5101],rep:1000,repeat:"einmalig",cooldown:"–",
 tags:["Travel","AICamp","Sequential","Gruppenquest"],
 dialog:{an:"Wir haben uns den Bericht aus Solnechny genauer angesehen, <>. Einer meiner Männer hat südlich der Route Spuren gefunden. Mehrere Personen, schweres Gepäck – und sie führen weg vom Posten.\n\nIch glaube nicht mehr daran, dass unsere Leute einfach verschwunden sind. Da draußen hat sich jemand eingerichtet, und ich will wissen, wer.\n\nFolge der Spur. Wenn du auf ein Lager stößt und es tatsächlich Banditen sind, räum es aus dem Weg. Aber unterschätz sie nicht. Das hier ist keine Kontrollrunde mehr.",
  offen:"Die Spur ist noch heiß, <>. Finde heraus, wohin sie führt. Und wenn du auf die Banditen stößt, sorg dafür, dass keiner von ihnen unseren nächsten Posten ins Visier nimmt.",
  ab:"Sechs Mann? Dann war das kein zufälliger Überfall.\n\nDie haben dort auf etwas gewartet – oder jemanden. Und wenn sie einen unserer Posten ausgeschaltet haben, kennen sie unsere Wege wahrscheinlich besser, als mir lieb ist.\n\nDu hast gute Arbeit geleistet, <>. Aber ich fürchte, wir haben gerade erst angefangen, an diesem Problem zu kratzen."},
 objectiveText:"3x Travel (Spuren), anschließend 1x AICamp.",
 objectiveExtra:["AICamp: 6 Banditen","Fraktion: Mercenaries","Loadout: BanditLoadout_Solnechny","Position: [10435.55, 283.08, 5967.66]"],
 delivery:null,
 reward:{items:[{q:1,n:"My_DF_Weapons_Rifles_AKM",note:"10%/90% Zustand"},{q:2,n:"My_DF_Weapons_Rifles_AKM_30RndMag"}],rep:200},
 technical:["Tod bricht ab","SequentialObjectives"], note:null, status:"final"},

{id:5103,title:"Sicherung der Straße",npc:909,
 giver:npcLabel(909),turnIn:npcLabel(909),
 prereq:[5102],rep:1500,repeat:"einmalig",cooldown:"–",
 tags:["Travel","AICamp","Sequential","Gruppenquest"],
 dialog:{an:"Das Lager war nicht das Ende, <>. Einer unserer Versorgungstrupps hat auf dem Rückweg etwas Merkwürdiges gemeldet. Frische Spuren an der Straße, Schleifspuren im Dreck und Fahrzeugteile, die dort gestern noch nicht lagen.\n\nIch will wissen, was da draußen passiert. Geh die Strecke ab und sieh dir die Spuren an. Wenn mein Verdacht stimmt, haben die Banditen angefangen, unsere Straßen zu kontrollieren.\n\nUnd falls du auf eine Blockade stößt – räum sie aus dem Weg. Alexandria kann es sich nicht leisten, dass irgendein Haufen Wegelagerer entscheidet, wer hier noch durchkommt.",
  offen:"Folge den Spuren, <>. Wenn dort draußen wirklich eine Blockade steht, will ich, dass sie verschwindet.",
  ab:"Eine richtige Straßenblockade... dann wissen wir jetzt wenigstens, was sie vorhaben.\n\nDie warten nicht mehr darauf, dass jemand zufällig in ihr Lager läuft. Sie gehen inzwischen gezielt auf unsere Versorgungswege.\n\nGut, dass du sie ausgeschaltet hast, <>. Aber ab jetzt behandeln wir das nicht mehr wie ein paar herumstreunende Banditen. Die organisieren sich."},
 objectiveText:"3x Travel, anschließend 1x AICamp.",
 objectiveExtra:["AICamp: 4 Banditen","Fraktion: Mercenaries","Loadout: BanditLoadout_Solnechny","Position: [3844.63, 234.91, 4789.68]"],
 delivery:null,
 reward:{items:[{q:1,n:"My_DF_Weapons_SMG_P90"},{q:1,n:"My_DF_Weapons_SMG_P90_50RndMag"},{q:1,n:"My_DF_Weapons_AmmoBox_57x28_SS190_100Rnd"},{q:1,n:"My_DF_Weapons_Attachments_barrel_P90Long"},{q:1,n:"My_DF_Weapons_Attachments_stock_P90_StockPad"}],rep:250},
 technical:["Tod bricht ab","SequentialObjectives"], note:null, status:"final"},

{id:5104,title:"Handel mit dem Sanctuary",npc:909,
 giver:npcLabel(909),turnIn:npcLabel(922),
 prereq:[5103],rep:1500,repeat:"einmalig",cooldown:"–",
 tags:["Travel","Sequential","Gruppenquest"],
 dialog:{an:"Die Blockade ist weg, <>. Damit können wir endlich wieder eine Verbindung nutzen, die uns in letzter Zeit gefehlt hat.\n\nIm Sanctuary sitzt ein Mann namens Nikolaj Batya. Wir kennen ihn schon eine Weile, und er hat Material für Alexandria zurückgelegt. Nichts davon bringt uns Ruhm, aber genau solche Lieferungen halten diesen Ort am Leben.\n\nGeh zum Sanctuary und such Nikolaj auf. Er weiß, dass jemand von uns kommt. Übernimm das Material und bring es zurück nach Alexandria. Und auch wenn die Straße wieder frei ist – bleib aufmerksam. Die Banditen sind nicht plötzlich verschwunden.",
  offen:"Nikolaj Batya wartet im Sanctuary auf dich, <>. Hol das Material ab und bring es sicher zurück nach Alexandria.",
  ab:"Nikolaj wiegt das Material kurz in den Händen, bevor er es dir übergibt. „Das ist alles, was für Alexandria zurückgelegt wurde. Pass unterwegs auf.“"},
 objectiveText:"3x Travel zum Sanctuary (Kontrollpunkt 1, Kontrollpunkt 2, Nikolaj).",
 objectiveExtra:[],
 delivery:null,
 reward:{items:[],rep:50,note:"Kein Item-Reward"},
 technical:["FollowUpQuest: 5098","Tod bricht nicht ab","SequentialObjectives"], note:"Turn-in bei Nikolaj Batya (922) im Sanctuary.", status:"final"},

{id:5098,title:"Rückweg nach Alexandria",npc:909,
 giver:npcLabel(922)+" (automatisch bei Annahme)",turnIn:npcLabel(909),
 prereq:[5104],rep:null,repeat:"einmalig",cooldown:"–",
 tags:["Delivery","Gruppenquest"],

  ab:"Gut. Alles angekommen.\n\nSolche Lieferungen sehen vielleicht nicht besonders beeindruckend aus, <>. Aber ohne Nachschub helfen uns auch Mauern und Waffen irgendwann nicht mehr weiter.\n\nDu hast inzwischen bewiesen, dass ich dich nicht nur zum Schießen gebrauchen kann. Wenn etwas wichtig ist und heil zurückkommen soll, kann ich dich losschicken. Das merke ich mir."},

{id:5105,title:"Eskorte des Ingenieurs",npc:909,
 giver:npcLabel(909),turnIn:npcLabel(909),
 prereq:[5098,5104],rep:1500,repeat:"einmalig",cooldown:"–",
 tags:["Travel","AIVIP","Escort","Sequential","Gruppenquest"],
 dialog:{an:"Ich habe einen Auftrag für dich, bei dem mir eine Kiste Material ausnahmsweise nicht reicht, <>.\n\nDu kennst inzwischen den Weg zum Sanctuary. Dort wartet ein Mann namens Pavel Novak. Ingenieur. Einer von der Sorte, die aus drei kaputten Maschinen wenigstens eine wieder zum Laufen bekommen.\n\nWir könnten jemanden wie ihn hier verdammt gut gebrauchen, und Pavel ist bereit, nach Alexandria zu kommen.\n\nDas Problem ist der Weg. Nach allem, was in letzter Zeit passiert ist, lasse ich ihn nicht allein durch die Gegend laufen.\n\nGeh zurück zum Sanctuary, finde Pavel und bring ihn sicher zu uns. Und diesmal gilt: Du kommst nicht allein zurück.",
  offen:"Pavel muss lebend nach Alexandria kommen, <>. Bleib bei ihm und lass ihn unterwegs nicht aus den Augen.",
  ab:"Da seid ihr ja. Gut.\n\nWillkommen in Alexandria, Pavel. Such dir erstmal einen Platz und komm zur Ruhe – Arbeit finden wir für dich früh genug.\n\nUnd du, <>... gute Arbeit. Material kann man ersetzen. Leute mit solchen Fähigkeiten nicht.\n\nDass ich dir jemanden anvertraue und ihr beide hier ankommt, sagt mir mehr als jeder Bericht."},
 objectiveText:"1x Travel zum Sanctuary, anschließend 1x AIVIP-Eskorte nach Alexandria.",
 objectiveExtra:["Start: Sanctuary [8157.56, 473.59, 9058.31]","AIVIP: Pavel Novak (Eskorte-Ziel, kein eigener Quest-NPC), eigenes Loadout mit 93R-Pistole + Attachments","Ziel: Alexandria [3723.91, 401.73, 6006.77]","Zielradius: 10 m"],
 delivery:null,
 reward:{items:[{q:1,n:"93R-Pistole"},{q:1,n:"My_DF_Weapons_Attachments_pisg_93RErgo"},{q:1,n:"My_DF_Weapons_Attachments_pisg_93RAdv"},{q:1,n:"My_DF_Weapons_Attachments_barrel_93RAuto"},{q:1,n:"My_DF_Weapons_Attachments_muzzle_Common1_2"},{q:1,n:"My_DF_Weapons_Attachments_other_PTMount"},{q:1,n:"FNP45_MRDSOptic"},{q:1,n:"12Rnd-Magazin"},{q:1,n:"24Rnd-Magazin"},{q:1,n:"AmmoBox 9x19 AP63"},{q:1,n:"Battery9V"}],rep:500},

{id:5106,title:"Das Ende der Spur",npc:909,
 giver:npcLabel(909),turnIn:npcLabel(923),
 prereq:[5105],rep:null,repeat:"einmalig",cooldown:"–",
 tags:["Travel","AICamp","Sequential","Gruppenquest"],
 dialog:{an:"Seit Pavel hier ist, haben wir uns alles noch einmal angesehen, <>. Die verschwundenen Leute, das Lager, die Straßenblockade, die Funkmeldungen und die Versorgungswege. Stück für Stück ergibt das Ganze endlich ein Bild.\n\nAlles führt zu einer Bohrinsel vor der Küste. Offenbar sitzt dort der Kern der Gruppe, die uns seit Wochen Probleme macht.\n\nAm Hafen steht ein Boot für dich bereit. Fahr rüber und räum die Stellung aus dem Weg. Auf der Insel hält sich ein Mann namens Alexei auf. Wenn du den Stützpunkt gesichert hast, such ihn. Er hat Unterlagen, die wir unbedingt brauchen.\n\nBring mir den Koffer zurück nach Alexandria.\n\nWir haben lange genug auf das reagiert, was diese Leute tun, <>. Diesmal gehen wir zu ihnen.",
  offen:"Die Sache auf der Bohrinsel ist noch nicht erledigt, <>. Räum den Stützpunkt, finde Alexei und bring den Koffer mit den Unterlagen zurück nach Alexandria. Erst dann wissen wir, womit wir es wirklich zu tun hatten.",
  ab:"Alexei zieht einen Koffer unter einem Tisch hervor. „Namen, Routen, Funkaufzeichnungen - alles, was wir sicherstellen konnten. Bring das zu deinen Leuten in Alexandria.“"},
 objectiveText:"Travel-Kette zum Hafen und zur Bohrinsel, danach AICamp und Rückgabe bei Alexei.",
 objectiveExtra:["Travel zum Hafen [378.84, 0.41, 1386.89] – Boot Boat_01_Orange steht dort dauerhaft bereit (mit Sparkplug + vollem Tank)","Travel zur Bohrinsel","AICamp: 9 Banditen gesamt (4 unten ~13,9 m Höhe + 5 oben ~29–33 m Höhe), Fraktion Mercenaries, Loadout BanditLoadout_Bohrinsel (AK12+30Rnd über Schulter, 93R+12Rnd im Hosen-Holster, Tomahawk, FOG-Ausrüstung)","Travel zu Alexei"],
 delivery:null,
 reward:{items:[],rep:300,note:"Kein Item-Reward"},
 technical:["FollowUpQuest: 5099","Tod bricht ab","SequentialObjectives","ReputationRequirement nicht separat dokumentiert"], note:"Turn-in bei Alexei (923) auf der Bohrinsel.", status:"final"},

{id:5099,title:"Der Beweiskoffer",npc:909,
 giver:npcLabel(923)+" (automatisch bei Annahme)",turnIn:npcLabel(909),
 prereq:[5106],rep:null,repeat:"einmalig",cooldown:"–",
 tags:["Delivery","Gruppenquest"],
 dialog:{an:"Alexei drückt dir den Koffer in die Hand. „Bring das direkt zu deinen Leuten. Und lass dich unterwegs von niemandem aufhalten.“",
  offen:"Der Koffer ist noch nicht in Alexandria angekommen, <>. Der Milizionär wartet darauf.",
  ab:"Da ist er also... der Koffer.\n\nNamen, Routen, Lieferungen, Funkaufzeichnungen... verdammt. Das erklärt einiges.\n\nDann war das alles tatsächlich miteinander verbunden. Der verschwundene Außenposten, das Lager, die Blockade – das waren keine einzelnen Zufälle. Sie hatten Struktur, Nachschub und einen Plan.\n\nAber die Bohrinsel ist gefallen und ihre Unterlagen liegen jetzt bei uns.\n\nDu hast uns nicht nur geholfen, ein paar Banditen loszuwerden, <>. Du hast dafür gesorgt, dass Alexandria endlich wieder einen Schritt voraus sein kann.\n\nFür den Moment ist diese Sache beendet. Gute Arbeit."},
 objectiveText:"Delivery-Objective. Abgabe spawnt automatisch bei Alexei.", objectiveExtra:[],
 delivery:[{q:1,n:"ExpansionBriefcase",note:"spawnt automatisch bei Alexei"}],
 reward:{items:[{q:1,n:"93R-Pistole (zweites komplettes Set)"},{q:1,n:"Ergo-Griff"},{q:1,n:"Adv-Griff"},{q:1,n:"Auto-Barrel"},{q:1,n:"Muzzle"},{q:1,n:"PT-Mount"},{q:1,n:"FNP45-Optik"},{q:1,n:"12Rnd-Magazin"},{q:1,n:"24Rnd-Magazin"},{q:1,n:"AmmoBox AP63"},{q:1,n:"Battery9V"}],rep:300},

{
 "id": 5200,
 "title": "Keine Namen",

 "giver": "Sergej (916)",
 "turnIn": "Viktor „Ratte“ Malenko (924)",

 "rep": 3000,
 "repeat": "einmalig",
 "cooldown": "–",
 "tags": [
  "Delivery",
  "Illegal",
  "Übergangsquest"
 ],
 "dialog": {
  "an": "Sokolova hat dich also wirklich geschickt, <>.\n\nSergej mustert dich einen Moment und stellt einen verschlossenen Koffer vor sich auf den Tisch.\n\nSie hält dich für zuverlässig. Das ist nett von ihr. Ich halte Menschen grundsätzlich erstmal für ein Problem.\n\nAlso machen wir es einfach.\n\nAußerhalb der üblichen Wege steht eine alte Scheune. Dort wartet ein Mann auf dich. Viktor. Manche nennen ihn Ratte – ich würde das an deiner Stelle nicht ausprobieren.\n\nDu gibst ihm diesen Koffer. Du öffnest ihn nicht. Du verlierst ihn nicht. Und du stellst keine Fragen.\n\nFalls unterwegs jemand wissen will, für wen du arbeitest, lautet die richtige Antwort: für niemanden.\n\nBring ihn hin. Danach sehen wir weiter.",
  "offen": "Viktor wartet auf den Koffer, <>.\n\nBring ihn zur Scheune und lass ihn geschlossen. Je weniger du über eine Lieferung weißt, desto weniger kannst du darüber erzählen.",
  "ab": "Du bist also der Neue.\n\nViktor schaut erst dich an, dann den Koffer.\n\nHat Sergej dir gesagt, was da drin ist?\n\nNein? Gut. Dann mag er dich vielleicht.\n\nViktor nimmt den Koffer und kontrolliert sorgfältig den Verschluss.\n\nNoch zu. Sehr schön.\n\nDamit ist dein Teil erledigt.\n\nWobei … wenn du schon mal hier bist: Unter dem Heu liegt etwas, das eigentlich nicht hier sein sollte."
 },

  "an": "Bevor du wieder verschwindest … ich hab da noch was.\n\nViktor greift hinter eine der Kisten und holt zwei Sachen hervor.\n\nHab ich beim Umräumen unter dem ganzen alten Heu gefunden. Definitiv nicht von mir.\n\nGelato. Gras erkenne sogar ich.\n\nUnd das hier gehört wohl zu einem Trockenständer.\n\nNimm beides und bring es Sergej. Vielleicht weiß der, wem das Zeug gehört.",

 "dialog": {
  "an": "Der Gelato-Block und der Trockenständer gehen mir nicht aus dem Kopf, <>.\n\nIch kenne jemanden, der dir sagen kann, was hinter dem Zeug steckt.\n\nMikhail Orlov.\n\nDie Leute nennen ihn Mr. White.\n\nEr hat sich draußen im Wald eingerichtet.\n\nWenn es um Pflanzen, Chemie und Dinge geht, die man besser nicht offen in Alexandria herumliegen lässt, ist er verdammt gut.\n\nGeh zu ihm und sag ihm, dass ich dich schicke.\n\nUnd noch etwas. Fass dort nichts an. Ich meine das ernst.",
  "offen": "Mr. White sitzt draußen im Wald, <>.\n\nFind ihn und sag ihm, dass du von mir kommst.\n\nUnd denk an meinen Rat: Hände bei dir behalten.",
  "ab": "Stopp.\n\nMikhail hebt eine Hand, noch bevor du etwas sagen kannst.\n\nNicht den Tisch. Nicht die Flaschen. Nicht die Pflanzen.\n\nSergej schickt dich?\n\nMikhail Orlov. Mr. White reicht.\n\nDu bist also derjenige mit dem Gelato.\n\nAnbauen kann jeder Idiot mit Erde, Wasser und genug Geduld. Interessant wird es erst danach.\n\nTrocknen. Verarbeiten. Lagern. Qualität erhalten.\n\nWenn Sergej dich wirklich zu mir schickt, finden wir jetzt heraus, ob du nur Sachen von A nach B tragen kannst … oder ob du auch etwas lernst."

  "an": "Du hast also schon mit Pflanzen gearbeitet.\n\nDie Gärtnerin hat dir gezeigt, wie man das Zeug aus der Erde bekommt. Ich zeige dir, was danach passiert.\n\nBud Branches zuerst auf dem Trockenständer trocknen. Danach nimmst du die getrockneten Branches und verarbeitest sie mit einem Messer zu Buds.\n\nZweites Rezept: Zwei Buds derselben Sorte miteinander kombinieren. Aus zwei Buds wird ein verpackter Zip-Bud.\n\nIch will acht saubere Zip-Buds. Das bedeutet sechzehn Buds derselben Sorte.",

  "an": "Du erinnerst dich, dass ich gesagt habe, einer fehlt?\n\nIn diesem Haus arbeiten normalerweise sieben Leute. Du hast sechs erledigt.\n\nDer Siebte war ihr Beschaffer. Chemikalien. Werkzeug. Material.\n\nGeh noch einmal zurück zum Drogenhaus. Sieh dich diesmal genauer um.\n\nLeichen sind nicht besonders gesprächig. Aber Menschen hinterlassen Dinge.",

/* ============================================================
   HILFSFUNKTIONEN
   ============================================================ */
function repeatLabel(r){return r==="wiederholbar"?"Wiederholbar":r==="taeglich"?"Wiederholbar (Täglich)":"Einmalig";}
function repDisplay(rep){ return (rep===null||rep===undefined) ? "Nicht separat dokumentiert" : (rep>0 ? rep+"+" : "0 (keine)"); }
function statusLabel(s){return s==="final"?"Final":s==="im-aufbau"?"Im Aufbau":s==="geplant"?"Geplant":s==="entwurf"?"Entwurf (nicht final)":s;}
function statusBadgeClass(s){return s==="final"?"final":s==="im-aufbau"?"aufbau":s==="geplant"?"geplant":s==="entwurf"?"aufbau":"";}
function fmtItem(it){
  let s = it.q+"x "+it.n;
  if(it.note) s += " ("+it.note+")";
  return s;
}
function esc(s){ return (s===null||s===undefined) ? "" : String(s); }

function badgesForQuest(q){
  let b = [];
  b.push('<span class="badge '+statusBadgeClass(q.status)+'">'+statusLabel(q.status)+'</span>');
  b.push('<span class="badge">'+repeatLabel(q.repeat)+'</span>');
  if(q.rep>0) b.push('<span class="badge rep">Rep '+q.rep+'+</span>');
  (q.tags||[]).forEach(t=>{
    let cls = t==="Illegal"?"illegal":(t.indexOf("Übergang")>=0?"uebergang":(t==="Kapitel-Abschluss"?"chapter":""));
    b.push('<span class="badge '+cls+'">'+t+'</span>');
  });
  return b.join("");
}

function questCard(q){
  const n = npc(q.npc);
  return '<div class="card" onclick="openQuest('+q.id+')">'
    +'<div class="row1"><span class="qid">#'+q.id+'</span></div>'
    +'<h3>'+esc(q.title)+'</h3>'
    +'<div class="metaline"><b>'+ (n?n.name:"?") +'</b> · Rep '+repDisplay(q.rep)+'</div>'
    +'<div class="badges">'+badgesForQuest(q)+'</div>'
    +'</div>';
}

  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));

let questFilters = { npc:"", rep:"", type:"", search:"" };
const FILTER_CHIPS = ["einmalig","wiederholbar","taeglich","Kein Cooldown","Collection","Delivery","Travel","Target","Action","Crafting","AICamp","AIPatrol","AIVIP","Escort","TreasureHunt","Sequential","Gruppenquest","Kapitel-Abschluss","Übergangsquest","Illegal","final","entwurf"];
let activeChips = new Set();

function renderQuests(){
  const el = document.getElementById("view-quests");
  el.innerHTML = `
    <h2 class="viewtitle"><span class="f2">Datenbank</span>Alle Quests</h2>
    <p class="viewdesc">Vollständige Liste aller ${QUESTS.length} Quests. Nutze Suche und Filter, um gezielt nach NPC, Item, Reputation oder Questtyp zu filtern.</p>
    <div class="toolbar">
      <input type="text" id="quest-search" placeholder="Suche: Quest-ID, Name, NPC, Item, Reward, Classname..." oninput="onQuestSearch(this.value)">
      <select id="npc-filter" onchange="onNpcFilter(this.value)">
        <option value="">Alle NPCs</option>
        ${NPCS.filter(n=>!n.minor).map(n=>'<option value="'+n.id+'">'+n.name+'</option>').join("")}
      </select>
    </div>
    <div class="chip-filters" id="chip-filters"></div>
    <div class="grid" id="quest-grid"></div>
  `;
  document.getElementById("chip-filters").innerHTML = FILTER_CHIPS.map(c=>
    '<span class="chip'+(activeChips.has(c)?' on':'')+'" onclick="toggleChip(\''+c+'\')">'+c+'</span>'
  ).join("");
  document.getElementById("quest-search").value = questFilters.search;
  document.getElementById("npc-filter").value = questFilters.npc;
  paintQuestGrid();
}
function onQuestSearch(v){ questFilters.search = v.toLowerCase(); paintQuestGrid(); }
function onNpcFilter(v){ questFilters.npc = v; paintQuestGrid(); }
function toggleChip(c){
  if(activeChips.has(c)) activeChips.delete(c); else activeChips.add(c);
  renderQuests();
}
function questMatchesSearch(q,term){
  if(!term) return true;
  const n = npc(q.npc);
  const haystack = [
    q.id, q.title, n?n.name:"", q.rep,
    (q.delivery||[]).map(i=>i.n).join(" "),
    (q.startItems||[]).map(i=>i.n).join(" "),
    (q.loot||[]).map(i=>i.n).join(" "),
    (q.reward.items||[]).map(i=>i.n).join(" "),
    q.objectiveText||"", (q.objectiveExtra||[]).join(" "),
    (q.tags||[]).join(" ")
  ].join(" ").toLowerCase();
  return haystack.indexOf(term)>=0;
}
function questMatchesChips(q){
  if(activeChips.size===0) return true;
  for(const c of activeChips){
    if(c==="einmalig" && q.repeat==="einmalig") continue;
    if(c==="wiederholbar" && (q.repeat==="wiederholbar"||q.repeat==="taeglich")) continue;
    if(c==="taeglich" && q.repeat==="taeglich") continue;
    if(c==="Kein Cooldown" && q.cooldown==="Kein Cooldown") continue;
    if(c==="final" && q.status==="final") continue;
    if(c==="entwurf" && q.status==="entwurf") continue;
    if((q.tags||[]).some(t=>t.toLowerCase().indexOf(c.toLowerCase())>=0)) continue;
    return false;
  }
  return true;
}
function paintQuestGrid(){
  let list = QUESTS.filter(q=>{
    if(questFilters.npc && String(q.npc)!==String(questFilters.npc)) return false;
    if(!questMatchesSearch(q,questFilters.search)) return false;
    if(!questMatchesChips(q)) return false;
    return true;
  });
  document.getElementById("quest-grid").innerHTML = list.length
    ? list.map(questCard).join("")
    : '<div class="empty-msg">Keine Quests gefunden.</div>';
}

  }).join("");
}

/* ============================================================
   RENDER: ITEMS (Item-Datenbank, automatisch generiert)
   ============================================================ */
function buildItemIndex(){
  const idx = {};
  function add(name, questId, questTitleStr, kind){
    if(!idx[name]) idx[name]=[];
    idx[name].push({questId,questTitleStr,kind});
  }
  QUESTS.forEach(q=>{
    (q.delivery||[]).forEach(it=>add(it.n, q.id, q.title, "Abgabe/Benötigt"));
    (q.startItems||[]).forEach(it=>add(it.n, q.id, q.title, "Startitem"));
    (q.loot||[]).forEach(it=>add(it.n, q.id, q.title, "Questloot/Fund"));
    (q.reward.items||[]).forEach(it=>add(it.n, q.id, q.title, "Reward"));
  });
  return idx;
}
function renderItems(){
  const el = document.getElementById("view-items");
  const idx = buildItemIndex();
  const names = Object.keys(idx).sort((a,b)=>a.localeCompare(b));
  el.innerHTML = `
    <h2 class="viewtitle"><span class="f2">Datenbank</span>Item-Datenbank</h2>
    <p class="viewdesc">Automatisch aus allen Questdaten erzeugt: ${names.length} unterschiedliche Items/Classnames, verwendet als Abgabe/Benötigt oder als Reward.</p>
    <div class="toolbar"><input type="text" id="item-search" placeholder="Item / Classname suchen..." oninput="paintItems(this.value)"></div>
    <div id="item-list"></div>
  `;
  window.__itemIndex = idx;
  window.__itemNames = names;
  paintItems("");
}
function paintItems(term){
  term = (term||"").toLowerCase();
  const idx = window.__itemIndex, names = window.__itemNames;
  const filtered = names.filter(n=>n.toLowerCase().indexOf(term)>=0);
  document.getElementById("item-list").innerHTML = filtered.map(name=>{
    const uses = idx[name];
    const reqCount = uses.filter(u=>u.kind==="Abgabe/Benötigt").length;
    const rewCount = uses.filter(u=>u.kind==="Reward").length;
    const lootCount = uses.filter(u=>u.kind==="Questloot/Fund"||u.kind==="Startitem").length;
    return '<details class="itemdb-entry"><summary><span class="n">'+esc(name)+'</span><span class="c">'+reqCount+'× benötigt · '+lootCount+'× Start/Fund · '+rewCount+'× Reward</span></summary>'
      +'<div class="body">'+uses.map(u=>'<div class="usage-row"><span><span class="linkchip" onclick="openQuest('+u.questId+')">'+questTitle(u.questId)+'</span></span><span class="tag '+(u.kind==="Reward"?"rew":"req")+'">'+u.kind+'</span></div>').join("")+'</div></details>';
  }).join("") || '<div class="empty-msg">Keine Items gefunden.</div>';
}

/* ============================================================
   RENDER: OFFENE PUNKTE / DATENPRÜFUNG
   ============================================================ */
function renderIssues(){
  const el = document.getElementById("view-issues");
  const idCounts={}; QUESTS.forEach(q=>idCounts[q.id]=(idCounts[q.id]||0)+1);
  const dupes=Object.entries(idCounts).filter(([id,c])=>c>1);
  const missingPrereq=[]; QUESTS.forEach(q=>(q.prereq||[]).forEach(p=>{if(!quest(p))missingPrereq.push({quest:q.id,missing:p});}));
  const notFinal=QUESTS.filter(q=>q.status!=="final");
  el.innerHTML=`<h2 class="viewtitle"><span class="f2">QA & PLANUNG</span>Offene Punkte</h2><p class="viewdesc">Was fehlt noch, was muss serverseitig verifiziert werden und wo geht die Questplanung als Nächstes weiter?</p><div class="section-block"><h4>Aktuell offene Punkte</h4><table class="datacheck"><tr><th>Bereich</th><th>Status</th><th>Offener Punkt</th></tr>${OPEN_POINTS.map(o=>'<tr><td><b>'+esc(o.area)+'</b></td><td class="status-open">'+esc(o.status)+'</td><td>'+esc(o.text)+'</td></tr>').join("")}</table></div><div class="section-block"><h4>Automatische Datenprüfung</h4><div class="kv"><div class="k">Doppelte Quest-IDs</div><div class="v">${dupes.length?dupes.map(([id,c])=>"#"+id+" ("+c+"×)").join(", "):"Keine – OK"}</div><div class="k">Fehlende Prereq-IDs</div><div class="v">${missingPrereq.length?missingPrereq.map(m=>"#"+m.quest+" → #"+m.missing).join(", "):"Keine – OK"}</div><div class="k">Nicht finale Live-Quests</div><div class="v">${notFinal.length?notFinal.map(q=>"#"+q.id).join(", "):"Keine – OK"}</div><div class="k">Illegale Reihe ausgearbeitet</div><div class="v">5200–5207</div><div class="k">Illegale Reihe Roadmap</div><div class="v">5208–5221</div></div></div><div class="section-block"><h4>Hinweise</h4><ul class="itemlist"><li><span></span><span>Quest 5000 hat weiterhin den bekannten technischen FollowUp-Hinweis auf 5001, während die tatsächliche Einstiegskette über 5023 läuft.</span></li><li><span></span><span>5009 wird thematisch beim Basisausbau/Boris geführt, technisch aber von Miroslav gestartet und bei Boris abgegeben.</span></li><li><span></span><span>5207 hat bewusst keinen separaten Item-Reward: Der komplette Loot aus beiden Seekisten bleibt beim Spieler.</span></li></ul></div>`;
}
